[package]
name = "arcdockwin"
version = "0.1.0"
edition = "2024"

[dependencies]
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Accessibility","Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_System_Variant", "Win32_System_Com_StructuredStorage", "Win32_System_Registry", "UI_Composition", "UI_Composition_Desktop", "System", "Foundation_Numerics", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_Security"] }
windows-numerics = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
